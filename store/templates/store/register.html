{% extends 'store/base.html' %}


{% block title %}
    Register - ShopZone
{% endblock title %}
    


{% block content %}
    <div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 text-centre">
            Create an Account
        </h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div><label class="block text-sm font-medium">Username</label>{{ form.username }}</div>
            <div><label class="block text-sm font-medium">First Name</label>{{ form.first_name }}</div>
            <div><label class="block text-sm font-medium">Last Name</label>{{ form.last_name }}</div>
            <div><label class="block text-sm font-medium">Email</label>{{ form.email }}</div>
            <div><label class="block text-sm font-medium">Password</label>{{ form.password }}</div>
            <div><label class="block text-sm font-medium">Confirm Password</label>{{ form.password_confirm }}</div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold rounded-lg py-2.5 hover:gb-indigo-700 transition">
                Register
            </button>
        </form>
    </div>
{% endblock content %}
