{% extends 'store/base.html' %}

{% block title %}Payment Successful - ShopZone{% endblock title %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-12">
    <div class="mb-4 text-green-500">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
    </div>
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Payment Successful!</h1>
    <p class="text-gray-600 mb-6">Thank you for your purchase. We are preparing your order now.</p>
    <a href="{% url 'profile' %}" class="inline-block bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">View Order Details</a>
</div>
{% endblock content %}
