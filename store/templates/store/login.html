{% extends 'store/base.html' %}


{% block title %}
    Login - ShopZone
{% endblock title %}
    


{% block content %}
    <div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 text-center">
            Log In
        </h2>
        {% csrf_token %}
        <div><label class="block text-sm font-medium">Username</label><input type="text" name="username" class="w-full p-2.5 border border-gray-300 rounded-lg"></div>

        <div><label class="block text-sm font-medium">Password</label><input type="password" name="password" class="w-full p-2.5 border border-gray-300 rounded-lg"></div>
        
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition">Log In</button>
    </div>
{% endblock content %}
