{% extends 'store/base.html' %}
{% block title %}Order Confirmed - ShopZone{% endblock %}

{% block content %}
<div class="bg-white border border-gray-200 rounded-lg p-12 text-center max-w-xl mx-auto">
    <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">Thank You!</h1>
    <p class="text-gray-700 text-lg mb-4">Your order has been placed successfully.</p>
    <p class="text-sm text-gray-500 mb-6">Order ID: <span class="font-bold text-gray-900">#{{ order.id }}</span></p>
    <a href="{% url 'product_list' %}" class="inline-block bg-indigo-600 text-white font-bold px-6 py-3 rounded-lg hover:bg-indigo-700 transition">
        Continue Shopping
    </a>
</div>
{% endblock %}
